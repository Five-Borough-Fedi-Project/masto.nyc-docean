# mastodon-large, the bare-metal cluster. Apply with --context=lab.
# Only the mastodon namespace on that cluster is in scope.
#
# Runs the web tier, Sidekiq and its own tunnel. Streaming and the cronjobs stay
# on do-production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mastodon
resources:
  - ../../base/priority-classes
  - ../../base/nginx
  - ../../base/mastodon-web
  - ../../apps/sidekiq
  - cloudflared.yaml
  - cloudflared-config.yaml
  - pdb-web.yaml
patches:
  - path: patch-web.yaml
    target:
      kind: Deployment
      name: mastodon-web
  - path: patch-sidekiq.yaml
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component in (sidekiq-bulk,sidekiq-realtime,sidekiq-sched)
images:
  - name: ghcr.io/mastodon/mastodon
    newTag: v4.7.0
