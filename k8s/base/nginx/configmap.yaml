apiVersion: v1
kind: ConfigMap
metadata:
  name: masto-nginx-config-prd
  namespace: mastodon
data:
  nginx.conf: |
    pid        /tmp/nginx.pid;
    events {}
    # Was /dev/null at both levels. vector shipped these to BetterStack and
    # vector is gone, so a 502 left nothing anywhere in the stack to read.
    error_log /dev/stderr warn;
    http 
    {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp_path;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      # Non-2xx only. This proxy carries every request to the site and the
      # cache serves a good share of them; a full access log is volume nobody
      # is currently collecting.
      map $status $loggable {
        ~^[23]  0;
        default 1;
      }
      log_format  main '$remote_addr $request_method $request_uri $status '
                       '$body_bytes_sent $request_time $upstream_cache_status';
      access_log /dev/stdout main if=$loggable;

      # This cache is doing real work: 34,579 entries and a full 1.0GB on
      # mastodon-large, 312 on do-production, measured 2026-09-07. It is keyed
      # safely, because Mastodon sends vary: Authorization on API responses and
      # vary: Cookie on web ones and nginx keys on the varying headers.
      #
      # Reading it needs `su nginx`. The directory is 0700 nginx and the
      # container drops all capabilities, so a root shell has no CAP_DAC_OVERRIDE
      # and find returns nothing at all, with no error.
      #
      # max_size is the only thing bounding it: /tmp is the container's writable
      # layer on node storage. The pod carries an ephemeral-storage limit above
      # this so the kubelet has a number of its own to enforce.
      proxy_cache_path /tmp/proxycache levels=1:2 keys_zone=CACHE:10m inactive=7d max_size=1g;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      server {
        listen 80;
        listen [::]:80;
        server_name masto.nyc;

        keepalive_timeout    70;
        # The zone's proxy_read_timeout is 125. nginx defaults to 60, so a slow
        # request was cut here while the edge was still waiting and the client
        # got a 504 that did not come from Cloudflare.
        proxy_read_timeout   125s;
        proxy_send_timeout   125s;
        sendfile             on;
        # Mastodon's VIDEO_LIMIT is 99MB and Cloudflare's max_upload is 100MB.
        # At 80m this was the lowest ceiling in the chain, so a video Mastodon
        # advertises as acceptable got a 413 from here before Rails saw it.
        client_max_body_size 100m;

        #root /home/mastodon/live/public;

        gzip on;
        gzip_disable "msie6";
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml image/x-icon;

        # Answered by nginx itself. `location /` proxies to mastodon-web, so
        # probing it would report nginx unhealthy whenever Rails is unhealthy
        # and take the proxy down with it.
        location = /healthz {
          access_log off;
          add_header Content-Type text/plain;
          return 200 "ok\n";
        }

        location / {
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_pass_header Server;
          proxy_buffering on;
          proxy_redirect off;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_cache CACHE;
          proxy_cache_valid 200 7d;
          proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
          add_header X-Cached $upstream_cache_status;
          tcp_nodelay on;
          try_files $uri @proxy;
        }

        location @proxy {
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Proxy "";
          proxy_set_header X-Forwarded-Proto https;
          proxy_pass_header Server;
          proxy_pass http://mastodon-web.mastodon:3000;
          proxy_buffering on;
          proxy_redirect off;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;

          proxy_cache CACHE;
          proxy_cache_valid 200 7d;
          proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
          add_header X-Cached $upstream_cache_status;

          tcp_nodelay on;
        }

        error_page 404 500 501 502 503 504 /500.html;
      }


    }
