apiVersion: apps/v1
kind: Deployment
metadata:
  name: mastodon-nginx
  namespace: mastodon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
    spec:
      priorityClassName: masto-critical
      volumes:
        - name: masto-nginx-config
          configMap:
            name: masto-nginx-config-prd
      containers:
        - name: mastodon-nginx
          securityContext:
            # The official nginx image starts as root, chowns its temp
            # directories to uid 101 and then runs its workers as that user, so
            # it needs four capabilities rather than the one that is obvious:
            #
            #   NET_BIND_SERVICE  listen on 80
            #   CHOWN             chown /tmp/client_temp and friends to 101
            #   SETUID, SETGID    drop the workers to that user
            #
            # Dropping everything but NET_BIND_SERVICE crashlooped both clusters
            # on 2026-09-06 with:
            #   chown("/tmp/client_temp", 101) failed (1: Operation not permitted)
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
          # Sized from measurement, 2026-09-05: 2Mi idle on do-production,
          # 129Mi on large where it serves real traffic and fills proxy_cache.
          # Without a request this pod is BestEffort, which makes the proxy
          # carrying every inbound request the first thing the kubelet evicts
          # under node pressure.
          resources:
            requests:
              memory: "192Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
          image: nginx:1.30.3-alpine3.23-slim
          ports:
          - containerPort: 80
            name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: masto-nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
