apiVersion: apps/v1
kind: Deployment
metadata:
  name: mastodon-nginx
  namespace: mastodon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
    spec:
      priorityClassName: masto-critical
      volumes:
        - name: masto-nginx-config
          configMap:
            name: masto-nginx-config-prd
      containers:
        - name: mastodon-nginx
          securityContext:
            # NET_BIND_SERVICE is kept because this listens on 80. Dropping every
            # capability would leave it unable to bind the port it exists to serve.
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          # Sized from measurement, 2026-09-05: 2Mi idle on do-production,
          # 129Mi on large where it serves real traffic and fills proxy_cache.
          # Without a request this pod is BestEffort, which makes the proxy
          # carrying every inbound request the first thing the kubelet evicts
          # under node pressure.
          resources:
            requests:
              memory: "192Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
          image: nginx:1.30.3-alpine3.23-slim
          ports:
          - containerPort: 80
            name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: masto-nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
