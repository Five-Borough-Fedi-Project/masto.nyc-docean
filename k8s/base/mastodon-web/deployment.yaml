---
# Source: mastodon/templates/deployment-web.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mastodon
  name: mastodon-web
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/instance: mastodon
    app.kubernetes.io/version: "v4.7.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mastodon
      app.kubernetes.io/instance: mastodon
      app.kubernetes.io/component: web
      app.kubernetes.io/part-of: rails
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mastodon
        app.kubernetes.io/instance: mastodon
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: rails
    spec:
      serviceAccountName: mastodon
      securityContext:
        fsGroup: 991
        runAsGroup: 991
        runAsUser: 991
        # - name: masto-nginx-config
        #   configMap: 
        #     name: masto-nginx-config-prd
      containers:
        - name: mastodon-web
          resources:
            requests:
              memory: "1024Mi"
              cpu: "200m"
          image: "ghcr.io/mastodon/mastodon:v4.7.0"
          imagePullPolicy: IfNotPresent
          command:
            - bundle
            - exec
            - puma
            - -C
            - config/puma.rb
          envFrom:
          - secretRef:
              name: mastodon-env-secret
          - secretRef:
              name: mastodon-env-tf
          env:
            - name: "PORT"
              value: "3000"
            - name: "SKIP_EXECUTION"
              value: "true"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # Enabled 2026-09-05. Without a readiness probe the pod reports Ready
          # the moment the container starts, roughly 30 to 60 seconds before
          # Puma accepts connections, so nginx proxies to a socket that is not
          # listening. Observed directly during a restart on 2026-09-04.
          #
          # startupProbe first: 60 failures at 5s gives Puma five minutes to
          # boot, and liveness does not run until it passes, so a slow start
          # cannot be mistaken for a hang.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
        ### Currently nginx is just a standalone pod, but this setup MAY
        ### be more ideal as a sidecar. It also will probably need some sort
        ### of shared cache configured that I haven't accounted for here yet.
