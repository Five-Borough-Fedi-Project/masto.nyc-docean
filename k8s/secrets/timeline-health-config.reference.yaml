### This file is just for reference, as the one used in production is private.
### See private-configmap-timeline-health.yaml for the actual values.

# apiVersion: v1
# kind: ConfigMap
# metadata:
#   name: timeline-health-config
#   namespace: mastodon
# data:
#   HEARTBEAT_URL: "https://uptime.betterstack.com/api/v1/heartbeat/YOUR_HEARTBEAT_ID"
#   MASTODON_HOSTNAME: "masto.nyc"
#   FRESHNESS_THRESHOLD: "300"    # seconds; see the note below
#   SAMPLE_SIZE: "20"

# FRESHNESS_THRESHOLD is deliberately tight. The check exists to notice that the
# timeline has stopped showing near real time posts, so a loose threshold makes
# it useless: it would only fire once the instance had been silent for most of
# an hour, by which time you would have heard from a user.
#
# 300 seconds, measured 2026-09-05. On the federated timeline the median gap
# between posts is 5 seconds and p95 is 85. Five minutes is sixty times the
# median, so it stays quiet through ordinary bursts and fires on a real stall.
#
# It will still fail sometimes. The timeline is bursty: p99 is around 478
# seconds and the largest recent gap was 1489, so roughly a fifth of the time
# the newest post is older than 300 seconds and no heartbeat is sent.
#
# That is what the heartbeat grace period is for. Set the BetterStack monitor to
# expect a heartbeat every 30 minutes rather than every 5. One quiet stretch
# then costs nothing, and a genuine stall still alerts inside half an hour. The
# longest run of consecutive failures is the largest gap minus the threshold,
# about 20 minutes at this setting.
#
# It was 60 until 2026-09-05, which failed between 58 and 80 percent of the
# time depending on the window. A check that fails most of the time carries no
# information.
#
# Measure before changing it. Older history is thinned by
# mastodon-statuses-remove, so gaps further back are a retention artefact and
# will suggest a threshold far larger than the instance needs.
