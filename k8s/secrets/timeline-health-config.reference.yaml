### This file is just for reference, as the one used in production is private.
### See private-configmap-timeline-health.yaml for the actual values.

# apiVersion: v1
# kind: ConfigMap
# metadata:
#   name: timeline-health-config
#   namespace: mastodon
# data:
#   HEARTBEAT_URL: "https://uptime.betterstack.com/api/v1/heartbeat/YOUR_HEARTBEAT_ID"
#   MASTODON_HOSTNAME: "masto.nyc"
#   FRESHNESS_THRESHOLD: "1800"   # seconds; see the note below
#   SAMPLE_SIZE: "20"

# FRESHNESS_THRESHOLD was 60 until 2026-09-05, which failed roughly 98 percent
# of runs. The check asks whether the newest post on the federated timeline is
# younger than the threshold, and it runs every five minutes, so 60 seconds
# only passed in the minute after somebody posted. A failure skips the
# heartbeat, so the uptime monitor stayed red and the check told you nothing.
#
# 1800 comes from measurement. Over the last three hours of the timeline the
# median gap between posts is 4 seconds and the largest is 1229, so 30 minutes
# clears the observed maximum with room and still catches a federation stall
# inside half an hour.
#
# Measure again before changing it. Older history is thinned by
# mastodon-statuses-remove, so gaps further back are a retention artefact and
# will suggest a threshold far larger than the instance needs.
