# Encrypted secrets for do-production. Flux decrypts these during
# reconciliation using the sops-age Secret in flux-system.
#
# Encrypted files are still valid Kubernetes manifests: kind and metadata are
# readable, only the values under data and stringData are ciphertext, so
# kustomize can build this directory without a key.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mastodon
resources:
  - mastodon-env-secret.sops.yaml
  - storage-backup.sops.yaml
  - postgres-completion.sops.yaml
  - timeline-health-config.sops.yaml
  - welcome-access.sops.yaml
  - sync-blocked-email-domains.sops.yaml
