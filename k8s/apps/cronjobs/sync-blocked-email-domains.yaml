# Media cleanup
# We cleanup weekly, just like the default helm chart has set. There hasn't been
# much of a need to extend or shorten that so far.
---
# Source: mastodon/templates/cronjob-media-remove.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: mastodon
  name: sync-blocked-email-domains
spec:
  schedule: 0 3 * * *
  # This was the only cronjob left on the default Allow. It measured 115
  # minutes on 2026-09-05, so a run that slows down by a factor of twelve
  # overlaps the next night's and both write the same list.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # Raised from 14400 for the one-time removal drain. The 115 minutes this
      # was sized on was measured while every removal silently failed: the
      # script deleted by domain name against a route that resolves
      # EmailDomainBlock.find(params[:id]), so to_remove never drained and each
      # night retried every domain upstream had ever dropped. The run took 235
      # minutes on 2026-11-12 and has exceeded four hours every night since.
      #
      # Fixing the delete does not make the drain cheaper: a successful destroy!
      # costs the same request as today's 404 plus an audit row, so it is
      # slower per call. Eight hours covers that one run with room, and still
      # lands well before the next 03:00 schedule under Forbid.
      #
      # Bring this back down once a drained run has been measured. Steady state
      # should be roughly 543 pagination requests plus the day's new domains,
      # nothing like four hours.
      activeDeadlineSeconds: 28800
      # The run on 2026-08-31 failed and retried to the default limit of six.
      # At roughly two hours per attempt that is most of a day spent failing.
      backoffLimit: 1
      template:
        metadata:
          name: sync-blocked-email-domains
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync-blocked-email-domains
              # Runs about two hours. The image is a small script rather than
              # Rails, so the request is modest and the limit is loose enough
              # that a long run does not hit it.
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
              image: ghcr.io/five-borough-fedi-project/masto.nyc-docean/sync-blocked-email-domains@sha256:94096131649d8c36030ee0cc117cd99a442facee138eedd802526c812e4f2ad1
              imagePullPolicy: IfNotPresent
              env:
              - name: "MASTODON_HOST"
                value: "https://masto.nyc"
              - name: "MASTODON_API_TOKEN"
                valueFrom:
                  secretKeyRef:
                    name: sync-blocked-email-domains
                    key: key