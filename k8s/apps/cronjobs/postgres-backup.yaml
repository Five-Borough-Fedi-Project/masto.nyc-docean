# Tags Updater
# We are affected by:
# https://github.com/mastodon/mastodon/issues/20230
# Soooooooo this has to exist.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: mastodon
spec:
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # Measured 2026-09-05: the nightly dump of a 43GB database took 49.7
      # minutes. Four hours is the point past which it is stuck rather than
      # slow. Without a deadline a hung backup runs forever, and because
      # concurrencyPolicy is Forbid, every later night is skipped: backups stop
      # and nothing says so.
      activeDeadlineSeconds: 14400
      # One attempt, not the default six. Retrying a fifty minute dump six
      # times is five hours of a failure nobody is watching.
      backoffLimit: 1
      template:
        metadata:
          name: postgres-backup
        spec:
          restartPolicy: Never
          containers:
            - name: postgres-backup
              image: eeshugerman/postgres-backup-s3:16@sha256:cfcaa57732c13d0724312a2eea1ad3e385f5ed049de3c626d1ef28ecc13cdddb
              command:
                - /bin/sh
                - -c
              args:
                - "chmod +x /run.sh && /run.sh && /postgres.sh"
              volumeMounts:
              - mountPath: /postgres.sh
                name: postgres-completion
                subPath: postgres.sh
              env:
                - name: BACKUP_KEEP_DAYS
                  value: "14"
                - name: S3_ENDPOINT
                  value: "https://nyc3.digitaloceanspaces.com/"
                - name: S3_PREFIX
                  value: "backups"
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef:
                      name: storage-backup
                      key: DEFAULT_S3_REGION
                - name: S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: storage-backup
                      key: DEFAULT_S3_KEY_ID
                - name: S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: storage-backup
                      key: DEFAULT_S3_KEY_SECRET
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: storage-backup
                      key: postgres_bucket
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: masto-direct-db
                      key: postgres_host
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: masto-direct-db
                      key: postgres_port
                - name: POSTGRES_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: masto-direct-db
                      key: postgres_db
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: masto-direct-db
                      key: postgres_user
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: masto-direct-db
                      key: postgres_pass
              imagePullPolicy: IfNotPresent
          volumes:
          - name: postgres-completion
            configMap:
              name: postgres-completion
              defaultMode: 0755
