# Does anyone know whether sync-blocked-email-domains ran?
#
# Until 2026-09-05 the answer was the Vector -> BetterStack Logs pipeline. That
# was removed with the rest of the log shipping, and nothing collects pod logs
# now, so a CronJob that fails at 03:00 fails silently: it is in
# `kubectl get jobs` for whoever thinks to look, and nowhere else.
#
# Not every job here is in that position, which is worth saying so nobody builds
# a second one of these unnecessarily. postgres-backup and timeline-health-check
# send BetterStack Uptime heartbeats -- a different product from the Logs one,
# untouched by that teardown. Of the jobs with nothing at all,
# sync-blocked-email-domains is the one that matters most: it holds a Mastodon
# API token, runs about two hours, and had a real failure on 2026-08-31 that
# retried for most of a day before anyone noticed.
#
# kube-state-metrics already publishes the fact. It has run in kube-system since
# the teardown with no consumer, kept because whatever replaced that pipeline
# would want it. This is that consumer, for one metric:
# kube_cronjob_status_last_successful_time.
#
# Scope: one CronJob by name, because that is the one that was asked about. The
# CRONJOB variable is the only thing that ties it to that job; the same manifest
# copied with a different name covers any of the others.
#
# The timing arithmetic, since the numbers are not obvious. The watched job
# starts at 03:00 and takes about two hours, with a four-hour deadline, so on a
# good day it last succeeded between 05:00 and 07:00. Checking at 09:00 puts the
# age at two to four hours when all is well, and at twenty-six to twenty-eight
# when a single night was missed. Twenty hours sits clear of both.
#
# Reading the watched job's status needs the Kubernetes API, which needs a
# ServiceAccount: the `default` one in this namespace can read nothing, which is
# how it should stay. The Role below is the narrowest thing that answers "why
# did it fail": jobs to find the failure, pods to find the container's exit
# code, pods/log to read what it said. No write verbs, no secrets, and scoped to
# this namespace by being a Role rather than a ClusterRole.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sync-blocked-email-domains-watchdog
  namespace: mastodon
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sync-blocked-email-domains-watchdog
  namespace: mastodon
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sync-blocked-email-domains-watchdog
  namespace: mastodon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sync-blocked-email-domains-watchdog
subjects:
  - kind: ServiceAccount
    name: sync-blocked-email-domains-watchdog
    namespace: mastodon
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-blocked-email-domains-watchdog
  namespace: mastodon
spec:
  schedule: 0 9 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  # Three, so a run of bad nights is still legible after the fact. This job is
  # the thing that notices, so its own history is worth more than the watched
  # job's.
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      # No retries. A retry would post to Discord twice for one bad night.
      backoffLimit: 0
      template:
        metadata:
          name: sync-blocked-email-domains-watchdog
        spec:
          restartPolicy: Never
          serviceAccountName: sync-blocked-email-domains-watchdog
          containers:
            - name: watchdog
              # Already pinned in k8s/apps/debug/dbg.yaml, so it is one image to
              # keep current rather than two, and Renovate's cluster images
              # group already tracks it. curl and its CA bundle are what this
              # needs; alpine has neither without installing them at runtime.
              image: nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "10m"
                limits:
                  memory: "128Mi"
              env:
                # Optional on purpose. Terraform creates this secret only when
                # var.discord_ops_webhook is set, matching monitoring.tf, so
                # with no webhook configured the job still runs and still fails
                # loudly in the cluster -- it just has nowhere to post.
                - name: WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      name: discord-ops-webhook
                      key: url
                      optional: true
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  # jq is in this image and kubectl is not, so the API is queried with curl
                  # and read with jq. Checked rather than assumed: without it the diagnosis
                  # below is skipped and the message is built the old way, from integers and
                  # literals only.
                  HAVE_JQ=no
                  command -v jq >/dev/null 2>&1 && HAVE_JQ=yes

                  CRONJOB="sync-blocked-email-domains"
                  NS="mastodon"
                  MAX_AGE=72000
                  METRICS="http://kube-state-metrics.kube-system.svc.cluster.local:8080/metrics"

                  if ! curl -sf --max-time 30 "$METRICS" > /tmp/metrics; then
                    echo "FAIL: could not scrape kube-state-metrics at $METRICS"
                    echo "That is its own problem: without it this check is blind."
                    exit 1
                  fi

                  # Prometheus writes floats in scientific notation
                  # (1.7601234e+09), which awk parses and shell arithmetic does
                  # not. Hence awk for the conversion.
                  line=$(grep "^kube_cronjob_status_last_successful_time{" /tmp/metrics \
                           | grep "cronjob=\"${CRONJOB}\"" \
                           | grep "namespace=\"${NS}\"" || true)

                  if [ -n "$line" ]; then
                    last=$(printf '%s\n' "$line" | awk '{printf "%d", $NF}')
                  else
                    last=0
                  fi

                  now=$(date +%s)

                  if [ "$last" -eq 0 ]; then
                    detail="No successful run has ever been recorded for it."
                    age_h="never"
                  else
                    age=$(( now - last ))
                    age_h=$(( age / 3600 ))
                    detail="Last success was ${age_h}h ago, at $(date -u -d "@${last}" '+%Y-%m-%d %H:%M UTC' 2>/dev/null || echo "unix ${last}")."
                    if [ "$age" -le "$MAX_AGE" ]; then
                      echo "OK: ${CRONJOB} succeeded ${age_h}h ago."
                      exit 0
                    fi
                  fi

                  echo "FAIL: ${CRONJOB} has not succeeded within $(( MAX_AGE / 3600 ))h."
                  echo "$detail"

                  # Why, if the API will say. kube-state-metrics knows a run did not
                  # succeed and cannot know more than that, and the watched job keeps
                  # failedJobsHistoryLimit: 1, so the evidence is gone by the next run.
                  why=""
                  logs=""
                  SA=/var/run/secrets/kubernetes.io/serviceaccount
                  API=https://kubernetes.default.svc

                  if [ "$HAVE_JQ" = yes ] && [ -r "$SA/token" ]; then
                    kube() {
                      curl -sf --max-time 20 --cacert "$SA/ca.crt" \
                        -H "Authorization: Bearer $(cat "$SA/token")" "${API}$1"
                    }

                    # Excluding `-watchdog-` matters: this job's own name starts with the
                    # watched job's name, so without it the watchdog diagnoses itself.
                    if kube "/apis/batch/v1/namespaces/${NS}/jobs" > /tmp/jobs.json 2>/dev/null; then
                      job=$(jq -r --arg p "${CRONJOB}-" '
                        [.items[] | select(.metadata.name | startswith($p))
                                  | select(.metadata.name | test("-watchdog-") | not)]
                        | sort_by(.metadata.creationTimestamp) | last | .metadata.name // empty
                      ' /tmp/jobs.json)
                    else
                      job=""
                      why="The Kubernetes API would not list jobs, so there is no diagnosis."
                    fi

                    if [ -n "$job" ]; then
                      why=$(jq -r --arg j "$job" '
                        [.items[] | select(.metadata.name == $j)] | first as $x
                        | ($x.status.conditions // [] | map(select(.status == "True"))
                            | map("\(.type)" + (if (.reason // "") != "" then ": \(.reason)" else "" end)
                                              + (if (.message // "") != "" then " (\(.message))" else "" end))
                            | join("; ")) as $c
                        | "\($j) started \($x.status.startTime // "?"); "
                          + (if $c == "" then "no conditions reported yet" else $c end)
                      ' /tmp/jobs.json)

                      if kube "/api/v1/namespaces/${NS}/pods?labelSelector=job-name%3D${job}" \
                           > /tmp/pods.json 2>/dev/null; then
                        pod=$(jq -r '[.items[]] | sort_by(.metadata.creationTimestamp)
                                     | last | .metadata.name // empty' /tmp/pods.json)
                        if [ -n "$pod" ]; then
                          why="${why}
                  $(jq -r '[.items[]] | sort_by(.metadata.creationTimestamp) | last as $p
                            | (($p.status.containerStatuses // [])[0] // {}) as $c
                            | (($c.state.terminated // $c.lastState.terminated) // null) as $t
                            | if $t then "\($p.metadata.name): exit \($t.exitCode)"
                                        + (if $t.reason then " (\($t.reason))" else "" end)
                              else "\($p.metadata.name): phase \($p.status.phase // "unknown")" end
                           ' /tmp/pods.json)"

                          # Redacted before it leaves the cluster. This job holds a Mastodon
                          # API token and nobody here knows what its image logs -- there is no
                          # source for it in masto.nyc-docean. Twenty-five characters of
                          # token alphabet is shorter than any Mastodon token and longer than
                          # the words in a stack trace; dots and slashes are not in the class,
                          # so URLs and domain names survive.
                          logs=$(kube "/api/v1/namespaces/${NS}/pods/${pod}/log?tailLines=30" 2>/dev/null \
                                   | sed -E 's/[A-Za-z0-9_-]{25,}/[redacted]/g' \
                                   | tail -c 900 || true)
                        fi
                      fi
                    fi
                    [ -n "$why" ] && printf '%s\n' "$why"
                    [ -n "$logs" ] && printf 'last log lines:\n%s\n' "$logs"
                  fi

                  if [ -z "${WEBHOOK:-}" ]; then
                    echo "No webhook configured, so nothing was sent."
                    echo "Set var.discord_ops_webhook and apply, per kubernetes-secrets.tf."
                    exit 1
                  fi

                  # Same normalisation as terraform.yaml and
                  # mastodon-upgrade.yaml: one secret feeds the DigitalOcean
                  # alert policies, where it must end in /slack. Never echo it.
                  base="${WEBHOOK%/}"
                  base="${base%/slack}"
                  base="${base%/github}"

                  # jq builds the payload when it is there, because the diagnosis and the
                  # log tail are text from outside this file and printf cannot be trusted
                  # to escape them into JSON. The printf path below is kept for an image
                  # without jq, and interpolates nothing external -- which is what the old
                  # comment here was protecting.
                  if [ "$HAVE_JQ" = yes ]; then
                    jq -n --arg cronjob "$CRONJOB" --arg detail "$detail" \
                          --arg ns "$NS" --arg why "$why" --arg logs "$logs" '
                      def fence: "```\n" + . + "\n```";
                      {text: (
                        "**\($cronjob) has not run successfully**\n"
                        + $detail + "\n"
                        + (if $why != "" then $why + "\n"
                           else "Nothing collects pod logs, so the run is only visible in the cluster: kubectl -n \($ns) get jobs\n" end)
                        + (if $logs != "" then ($logs | fence) else "" end)
                      )}' > /tmp/payload.json
                  else
                    text="**${CRONJOB} has not run successfully**\\n${detail}\\nNothing collects pod logs, so the run is only visible in the cluster: kubectl -n ${NS} get jobs"
                    printf '{"text":"%s"}' "$text" > /tmp/payload.json
                  fi

                  code=$(curl -sS -o /tmp/response -w '%{http_code}' \
                    -X POST -H 'Content-Type: application/json' \
                    --data @/tmp/payload.json "${base}/slack")

                  if [ "$code" != "200" ] && [ "$code" != "204" ]; then
                    echo "Discord returned HTTP ${code}; the failure above still stands."
                    head -c 300 /tmp/response || true
                  else
                    echo "Notified Discord."
                  fi

                  # Non-zero regardless of whether Discord took it, so the
                  # cluster carries the signal too.
                  exit 1
