apiVersion: apps/v1
kind: Deployment
metadata:
  name: welcome-webhook
  namespace: mastodon
spec:
  selector:
    matchLabels:
      app: welcome-webhook
  template:
    metadata:
      labels:
        app: welcome-webhook
    spec:
      containers:
      - name: welcome-webhook
        # TODO: can the image be terraform-ed or put somewhere else, like github?
        image: ghcr.io/five-borough-fedi-project/masto.nyc-docean/welcome-bot:d0578001e86c45a75cd25bb9d258c68fdb195629
        imagePullPolicy: IfNotPresent
        # Sized from measurement, 2026-09-05: 41Mi and 3m on do-production.
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "192Mi"
        ports:
        - containerPort: 80
        env:
        - name: "WELCOMEACCESSTOKEN"
          valueFrom:
            secretKeyRef:
              name: welcome-access
              key: key