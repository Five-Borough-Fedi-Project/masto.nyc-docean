---
# Source: mastodon/templates/deployment-streaming.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mastodon
  name: mastodon-streaming
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/instance: mastodon
    app.kubernetes.io/version: "v4.7.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mastodon
      app.kubernetes.io/instance: mastodon
      app.kubernetes.io/component: streaming
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mastodon
        app.kubernetes.io/instance: mastodon
        app.kubernetes.io/component: streaming
    spec:
      priorityClassName: masto-critical
      serviceAccountName: mastodon
      securityContext:
        fsGroup: 991
        runAsGroup: 991
        runAsUser: 991
      containers:
        - name: mastodon-streaming
          image: "ghcr.io/mastodon/mastodon-streaming:v4.7.0"
          imagePullPolicy: IfNotPresent
          # Sized from measurement, 2026-09-05: 97Mi and 10m on do-production.
          # Without a request this pod is BestEffort, and BestEffort is the
          # first QoS class the kubelet evicts under node pressure. That put
          # the websocket tier at the front of the queue.
          resources:
            requests:
              memory: "128Mi"
              cpu: "25m"
            limits:
              memory: "384Mi"
          command:
            - node
            - ./streaming
          envFrom:
          - secretRef:
              name: mastodon-env-secret
          - secretRef:
              name: mastodon-env-tf
          env:
            - name: "PORT"
              value: "4000"
          ports:
            - name: streaming
              containerPort: 4000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/streaming/health
              port: streaming
          readinessProbe:
            httpGet:
              path: /api/v1/streaming/health
              port: streaming
