---
# Source: mastodon/templates/deployment-sidekiq.yaml
# Scheduler needs to be separate so it only ever has one instance running
# https://docs.joinmastodon.org/admin/scaling/#sidekiq-queues
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mastodon
  name: mastodon-sidekiq-sched
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/instance: mastodon
    app.kubernetes.io/version: "v4.7.0"
    app.kubernetes.io/component: sidekiq-sched
    app.kubernetes.io/part-of: rails
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mastodon
      app.kubernetes.io/instance: mastodon
      app.kubernetes.io/component: sidekiq-sched
      app.kubernetes.io/part-of: rails
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mastodon
        app.kubernetes.io/instance: mastodon
        app.kubernetes.io/component: sidekiq-sched
        app.kubernetes.io/part-of: rails
    spec:
      serviceAccountName: mastodon
      securityContext:
        fsGroup: 991
        runAsGroup: 991
        runAsUser: 991
      containers:
        - name: mastodon
          # Sidekiq serves no HTTP, so there is nothing to probe over a socket.
          # Mastodon touches this file once the process is ready to take jobs,
          # and the upstream chart offers exactly this probe. It ships disabled
          # because the path is configurable; the file is present here, checked
          # on a running pod.
          readinessProbe:
            exec:
              command:
                - cat
                - /opt/mastodon/tmp/sidekiq_process_has_started_and_will_begin_processing_jobs
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 10
          resources:
            requests:
              memory: "500Mi"
              cpu: "100m"
            limits:
              memory: "900Mi"
          securityContext:
            {}
          image: "ghcr.io/mastodon/mastodon:v4.7.0"
          imagePullPolicy: IfNotPresent
          command:
            - bundle
            - exec
            - sidekiq
            - -c
            - "25"
            - -q
            - "scheduler"
          envFrom:
          - secretRef:
              name: mastodon-env-secret
          - secretRef:
              name: mastodon-env-tf
          env:
            # Match DB_POOL to sidekiq concurrency. mastodon-env-secret sets 10
            # globally against -c 25, so threads block on connection checkout.
            - name: DB_POOL
              value: "25"
