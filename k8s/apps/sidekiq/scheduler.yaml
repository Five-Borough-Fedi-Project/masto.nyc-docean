---
# Source: mastodon/templates/deployment-sidekiq.yaml
# Scheduler needs to be separate so it only ever has one instance running
# https://docs.joinmastodon.org/admin/scaling/#sidekiq-queues
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mastodon
  name: mastodon-sidekiq-sched
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/instance: mastodon
    app.kubernetes.io/version: "v4.7.0"
    app.kubernetes.io/component: sidekiq-sched
    app.kubernetes.io/part-of: rails
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mastodon
      app.kubernetes.io/instance: mastodon
      app.kubernetes.io/component: sidekiq-sched
      app.kubernetes.io/part-of: rails
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mastodon
        app.kubernetes.io/instance: mastodon
        app.kubernetes.io/component: sidekiq-sched
        app.kubernetes.io/part-of: rails
    spec:
      serviceAccountName: mastodon
      securityContext:
        fsGroup: 991
        runAsGroup: 991
        runAsUser: 991
      containers:
        - name: mastodon
          # Sidekiq serves no HTTP, so there is nothing to probe over a socket.
          # Mastodon touches this file once the process is ready to take jobs,
          # and the upstream chart offers exactly this probe. It ships disabled
          # because the path is configurable; the file is present here, checked
          # on a running pod.
          readinessProbe:
            exec:
              command:
                - cat
                - /opt/mastodon/tmp/sidekiq_process_has_started_and_will_begin_processing_jobs
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 10
          # Sized for -c 5. At -c 25 this pod sat at 573Mi against a 900Mi
          # limit for a queue of periodic jobs; five threads need a fraction of
          # that, and the reservation was competing for space on 3Gi nodes.
          resources:
            requests:
              memory: "300Mi"
              cpu: "100m"
            limits:
              memory: "600Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          image: "ghcr.io/mastodon/mastodon:v4.7.0"
          imagePullPolicy: IfNotPresent
          command:
            - bundle
            - exec
            - sidekiq
            # The scheduler queue runs Mastodon's periodic jobs and nothing
            # else, a handful at a time on a cron. 25 threads was inherited from
            # the other two deployments, where it makes sense. It cost 20 of the
            # database connections counted in docs/improvement-plan.md and it
            # bought nothing.
            - -c
            - "5"
            - -q
            - "scheduler"
          envFrom:
          - secretRef:
              name: mastodon-env-secret
          - secretRef:
              name: mastodon-env-tf
          env:
            # Match DB_POOL to sidekiq concurrency, which is -c 5 here.
            - name: DB_POOL
              value: "5"
