---
# Source: mastodon/templates/deployment-sidekiq.yaml
#
# Throughput queues: backfill, FASP, and mail. Slower work that must not compete with user-facing jobs.
#
# Consolidated 2026-09-04. Seven single-queue deployments each booted a full
# Rails app, and the least busy of them still used 417Mi, so the process
# baseline was roughly 400Mi paid seven times. Sidekiq takes several queues per
# process with weights, which preserves priority without the duplication.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mastodon
  name: mastodon-sidekiq-bulk
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/instance: mastodon
    app.kubernetes.io/version: "v4.7.0"
    app.kubernetes.io/component: sidekiq-bulk
    app.kubernetes.io/part-of: rails
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mastodon
      app.kubernetes.io/instance: mastodon
      app.kubernetes.io/component: sidekiq-bulk
      app.kubernetes.io/part-of: rails
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mastodon
        app.kubernetes.io/instance: mastodon
        app.kubernetes.io/component: sidekiq-bulk
        app.kubernetes.io/part-of: rails
    spec:
      serviceAccountName: mastodon
      securityContext:
        fsGroup: 991
        runAsGroup: 991
        runAsUser: 991
      containers:
        - name: mastodon
          # Sidekiq serves no HTTP, so there is nothing to probe over a socket.
          # Mastodon touches this file once the process is ready to take jobs,
          # and the upstream chart offers exactly this probe. It ships disabled
          # because the path is configurable; the file is present here, checked
          # on a running pod.
          readinessProbe:
            exec:
              command:
                - cat
                - /opt/mastodon/tmp/sidekiq_process_has_started_and_will_begin_processing_jobs
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 10
          # Raised 2026-09-07. This pod was OOMKilled on 2026-09-06 at 16:34,
          # after five and a half hours against the old 1100Mi ceiling, and
          # sidekiq-realtime sat at 735Mi against the same one. An OOMKill here
          # is not free: plain Sidekiq has no super_fetch, so whatever the 25
          # threads were holding is lost instead of requeued.
          #
          # mastodon-web argues, in its own manifest, that a limit guessed below
          # the real peak OOMKills the tier it was meant to protect. That was
          # right and it was not applied here. The peak is still unrecorded, so
          # 1500Mi is headroom over anything observed rather than a measurement.
          #
          # It stays a limit, unlike web's, because these nodes are 3Gi and this
          # pod shares one with the web tier. Sidekiq carries no priority class
          # and web carries masto-critical, so under node pressure this is the
          # one that goes, which is the right order. The request is unchanged:
          # raising it would only make this pod harder to schedule.
          resources:
            requests:
              memory: "700Mi"
              cpu: "200m"
            limits:
              memory: "1500Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          image: "ghcr.io/mastodon/mastodon:v4.7.0"
          imagePullPolicy: IfNotPresent
          command:
            - bundle
            - exec
            - sidekiq
            - -c
            - "25"
            - -q
            - "pull,4"
            - -q
            - "fasp,8"
            - -q
            - "mailers,2"
          envFrom:
          - secretRef:
              name: mastodon-env-secret
          - secretRef:
              name: mastodon-env-tf
          env:
            # ActiveRecord must offer at least as many connections as sidekiq
            # has threads, or threads block on checkout. mastodon-env-secret
            # sets DB_POOL=10 globally against -c 25, which was wrong.
            - name: DB_POOL
              value: "25"
