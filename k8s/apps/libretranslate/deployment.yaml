apiVersion: apps/v1
kind: Deployment
metadata:
  name: libretranslate
  namespace: mastodon
spec:
  strategy:
    # The models volume is ReadWriteOnce. A rolling update would want two pods
    # holding it at once, and the new one would sit Pending until the old one
    # went away, which it never would.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: libretranslate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: libretranslate
    spec:
      securityContext:
        # The image runs as uid 1032, gid 65534. A newly provisioned volume
        # comes up root-owned, so without this the models directory is
        # unwritable and the first boot fails.
        fsGroup: 65534
      priorityClassName: masto-low
      containers:
      - name: libretranslate
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        image: docker.io/libretranslate/libretranslate:v1.9.6@sha256:1de2d7056bb8ad607a412f4563d9abe324ff632b43b5be9428bcc8e213aebb32
        # Sized from measurement, 2026-09-05: 186Mi and 1m on do-production.
        # The limit is deliberately loose because LT_UPDATE_MODELS pulls
        # language models at startup and that is the memory peak, not steady
        # state. Before this the pod was BestEffort and invisible to the
        # scheduler despite being the third largest thing in the namespace.
        resources:
          requests:
            memory: "256Mi"
            cpu: "10m"
          limits:
            memory: "768Mi"
        volumeMounts:
        - name: models
          mountPath: /home/libretranslate/.local/share/argos-translate
        ports:
        - containerPort: 5000
        # Measured 2026-09-05: a cold request took over 10 seconds and under 30,
        # because models load on first use. 40 failures at 15 seconds allows ten
        # minutes before the pod is called failed, and readiness keeps it out of
        # the Service until it can actually answer.
        startupProbe:
          httpGet:
            path: /languages
            port: 5000
          failureThreshold: 40
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /languages
            port: 5000
          periodSeconds: 30
          timeoutSeconds: 10
        env:
        - name: "LT_HOST"
          value: "0.0.0.0"
        - name: "LT_UPDATE_MODELS"
          value: "true"
        - name: "LT_DISABLE_WEB_UI"
          value: "true"
        - name: "LT_SSL"
          value: "False"
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: libretranslate-models
