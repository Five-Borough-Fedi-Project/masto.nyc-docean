# Builds the first-party images under docker/ and pushes them to GHCR.
#
# Two deliberate constraints:
#
#   1. Pushes happen ONLY from main. Previously this ran on any branch, which
#      meant a feature branch touching docker/** would republish the :latest
#      tag -- and welcome-webhook pulled :latest with imagePullPolicy: Always,
#      so a branch push could change production behaviour on the next restart.
#      Pull requests still build (catching broken Dockerfiles) but never push.
#
#   2. Every push is tagged with the commit SHA as well as :latest. Manifests
#      should reference the SHA tag, never :latest, so that a deploy is
#      reproducible and can be rolled back. See
#      k8s/apps/welcome-webhook/deployment.yaml for the pattern.
#
#   3. After a push, bump-manifests opens a pull request pointing the manifests
#      at the images this run produced. Without it the rebuild is never
#      deployed, which is what happened on 2026-09-05.
name: Build and push Docker images to GitHub Container Registry

on:
  push:
    branches:
      - main
    paths:
      - 'docker/*/**'
      - '.github/workflows/docker_images.yaml'
  pull_request:
    paths:
      - 'docker/*/**'
      - '.github/workflows/docker_images.yaml'

permissions:
  contents: read
  packages: write

jobs:
  # Works out which images this change actually touches, so a change under
  # docker/welcome-bot does not rebuild and republish timeline-health.
  #
  # This is not only about wasted minutes. bump-manifests points manifests at
  # this commit's SHA, and it may only do that for images this run genuinely
  # pushed. Rebuilding everything made that safe by accident; building a subset
  # makes `names` load-bearing.
  find-dockerfiles:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      names: ${{ steps.set-matrix.outputs.names }}
      any: ${{ steps.set-matrix.outputs.any }}
      deploy_names: ${{ steps.set-matrix.outputs.deploy_names }}
      deploy_any: ${{ steps.set-matrix.outputs.deploy_any }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # Needed to diff against the base or the previous commit.
          fetch-depth: 0

      - name: Work out which images changed
        id: set-matrix
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            git fetch -q --depth=1 origin "$BASE_REF"
            range="origin/${BASE_REF}...HEAD"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..HEAD"
          else
            # First push on a branch, or a force push that orphaned `before`.
            range="HEAD~1..HEAD"
          fi
          echo "comparing $range"
          changed=$(git diff --name-only $range || true)
          echo "$changed" | sed 's/^/  /'

          # Images whose own source actually changed. These are the ones worth
          # deploying.
          # `|| true` because grep exits 1 when nothing matches, and under
          # `set -o pipefail` that would end the step rather than mean "no
          # images changed", which is a perfectly ordinary answer here.
          content_dirs=$(echo "$changed" \
            | grep -E '^docker/[^/]+/' \
            | cut -d/ -f1,2 \
            | sort -u \
            | while read -r d; do [ -f "$d/Dockerfile" ] && echo "$d"; done || true)

          # If the workflow itself changed, rebuild everything, because the
          # build logic changed and reasoning about what that edit affects is
          # not worth the risk. Building is cheap and proves the change works.
          #
          # Deploying is a different question. A workflow edit does not change
          # what is inside an image, so bumping the manifests would restart
          # every pod to run byte-identical software. Build wide, deploy narrow.
          if echo "$changed" | grep -qx '.github/workflows/docker_images.yaml'; then
            echo "workflow changed, rebuilding every image to validate the change"
            build_dirs=$(find docker -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' | sort)
          else
            build_dirs="$content_dirs"
          fi

          emit() { echo "$1" >> "$GITHUB_OUTPUT"; }

          if [ -z "${build_dirs:-}" ]; then
            echo "no image directories affected"
            emit "matrix=[]"; emit "names="; emit "any=no"
            emit "deploy_names="; emit "deploy_any=no"
            echo "No image needed rebuilding." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          matrix=$(echo "$build_dirs" | sed 's|$|/Dockerfile|' | jq -R . | jq -cs .)
          names=$(echo "$build_dirs" | sed 's|^docker/||' | tr '\n' ' ' | sed 's/ *$//')
          emit "matrix=$matrix"; emit "names=$names"; emit "any=yes"
          echo "building: $names"
          echo "Rebuilding: $names" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${content_dirs:-}" ]; then
            emit "deploy_names="; emit "deploy_any=no"
            echo "deploying: nothing, no image source changed"
            echo "No manifest bump: no image source changed, only the workflow." >> "$GITHUB_STEP_SUMMARY"
          else
            deploy_names=$(echo "$content_dirs" | sed 's|^docker/||' | tr '\n' ' ' | sed 's/ *$//')
            emit "deploy_names=$deploy_names"; emit "deploy_any=yes"
            echo "deploying: $deploy_names"
            echo "Manifest bump for: $deploy_names" >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-push:
    needs: find-dockerfiles
    if: needs.find-dockerfiles.outputs.any == 'yes'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: ${{ fromJson(needs.find-dockerfiles.outputs.matrix) }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Only needed when we are actually going to push.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          DOCKERFILE_PATH="${{ matrix.dockerfile }}"
          IMAGE_DIR=$(dirname "$DOCKERFILE_PATH")
          IMAGE_NAME=$(basename "$IMAGE_DIR")
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/$OWNER_LC/masto.nyc-docean/$IMAGE_NAME"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          docker build -t "$BASE:latest" -t "$BASE:${{ github.sha }}" "$IMAGE_DIR"

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$BASE:${{ github.sha }}"
          docker push "$BASE:latest"

  # Closes the loop between building an image and deploying it.
  #
  # Before this, a merge touching docker/** rebuilt and pushed an image tagged
  # with the new commit, and then nothing referenced it. The manifests kept
  # pointing at whatever SHA was pinned last time, so the rebuild sat in GHCR
  # unused until a human remembered to bump the tag. That happened on
  # 2026-09-05: security fixes for click and idna were built and pushed while
  # the running pod stayed on the old image.
  #
  # Renovate cannot do this. It is disabled for first-party images on purpose,
  # because the new tag is a commit SHA that does not exist until the merge
  # that produces it.
  #
  # It opens a pull request rather than committing to main, because Flux
  # applies main and a bad tag would deploy itself.
  bump-manifests:
    needs: [find-dockerfiles, build-and-push]
    if: github.event_name == 'push' && needs.find-dockerfiles.outputs.deploy_any == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Point the manifests at the images this run pushed
        id: bump
        env:
          SHA: ${{ github.sha }}
          NAMES: ${{ needs.find-dockerfiles.outputs.deploy_names }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          sha = os.environ["SHA"]
          # Only the images this run actually pushed. Bumping a manifest for an
          # image that was not rebuilt would point it at a tag that does not
          # exist in the registry.
          names = sorted(os.environ["NAMES"].split())
          prefix = r"ghcr\.io/five-borough-fedi-project/masto\.nyc-docean/"
          changed = []
          for f in sorted(pathlib.Path("k8s").rglob("*.yaml")):
              text = original = f.read_text()
              for n in names:
                  # Tag references only. A name followed by @ is digest-pinned
                  # and is left alone.
                  text = re.sub(rf"({prefix}{re.escape(n)}):[A-Za-z0-9._-]+",
                                rf"\g<1>:{sha}", text)
              if text != original:
                  f.write_text(text)
                  changed.append(str(f))
          print("images built: " + ", ".join(names))
          print("manifests changed: " + (", ".join(changed) if changed else "none"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("changed=%s\n" % ("yes" if changed else "no"))
              out.write("files=%s\n" % " ".join(changed))
          PY

      - name: Nothing to do
        if: steps.bump.outputs.changed == 'no'
        run: echo "Manifests already reference this commit. No pull request needed." >> "$GITHUB_STEP_SUMMARY"

      # A pull request opened with GITHUB_TOKEN does not trigger other
      # workflows, so the usual build and scan jobs will not run on it.
      # Validating here is what keeps that from being a hole.
      - name: Both clusters must still build, with every image pinned
        if: steps.bump.outputs.changed == 'yes'
        run: |
          set -euo pipefail
          for cluster in do-production large; do
            kubectl kustomize "k8s/clusters/$cluster" > "/tmp/$cluster.yaml"
            echo "  $cluster built"
          done
          python3 - <<'PY'
          import yaml, sys, re
          bad = []
          for cluster in ("do-production", "large"):
              for d in yaml.safe_load_all(open("/tmp/%s.yaml" % cluster)):
                  if not d:
                      continue
                  spec = d.get("spec") or {}
                  tmpl = spec.get("template") or (spec.get("jobTemplate") or {}).get("spec", {}).get("template")
                  if not tmpl:
                      continue
                  pod = tmpl.get("spec") or {}
                  for c in (pod.get("containers") or []) + (pod.get("initContainers") or []):
                      img = c.get("image", "")
                      if "@sha256:" in img:
                          continue
                      ref = img.rsplit("/", 1)[-1]
                      tag = ref.split(":", 1)[1] if ":" in ref else ""
                      if not (re.fullmatch(r"v?\d+\.\d+.*", tag) or re.fullmatch(r"[0-9a-f]{40}", tag)):
                          bad.append("%s: %s uses %r" % (cluster, d["metadata"]["name"], img))
          if bad:
              print("\n".join("  " + b for b in bad))
              sys.exit(1)
          print("  every image is pinned")
          PY

      - name: Open the pull request
        if: steps.bump.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          FILES: ${{ steps.bump.outputs.files }}
        run: |
          set -euo pipefail
          short="${SHA:0:7}"
          branch="automation/image-tags-${short}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- $FILES

          printf '%s\n\n%s\n' \
            "k8s: point first-party images at ${short}" \
            "The images under docker/ were rebuilt and pushed by the run for ${SHA}. Without this the manifests keep referencing the previous commit and the rebuild is never deployed. Both cluster overlays were built and checked for unpinned images before this branch was pushed." \
            > /tmp/msg
          git commit -F /tmp/msg
          git push -u origin "$branch"

          {
            echo "Automated. The run for \`${SHA}\` rebuilt and pushed every image under \`docker/\`, and these manifests still referenced the previous commit."
            echo
            echo "Merging deploys them: Flux reconciles \`main\` within ten minutes."
            echo
            echo "Both cluster overlays were built and checked for unpinned images before this pull request was opened, because a pull request created with \`GITHUB_TOKEN\` does not trigger the usual build and scan workflows."
            echo
            echo "Changed: \`${FILES}\`"
          } > /tmp/body

          # Creating a pull request needs an organisation setting that is off
          # here. The branch is what matters, so a refusal is reported and the
          # run still passes.
          if gh pr create --base main --head "$branch" \
               --title "k8s: point first-party images at ${short}" \
               --assignee "$ACTOR" --body-file /tmp/body; then
            echo "Pull request opened." >> "$GITHUB_STEP_SUMMARY"
          else
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            echo "::warning::Could not open the pull request. The branch is pushed."
            {
              echo "### Branch pushed, pull request not opened"
              echo
              echo "The organisation forbids GitHub Actions from creating pull"
              echo "requests, so \`${branch}\` has to be opened by hand."
              echo
              echo "[Open it here](${url})"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
