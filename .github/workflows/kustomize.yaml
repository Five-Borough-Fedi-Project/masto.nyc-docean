# Builds both cluster overlays on every pull request.
#
# This exists because kustomize is stricter than kubectl, and that strictness
# has already earned its keep. On 2026-09-04 it caught duplicate keys in a
# CronJob that kubectl had been silently resolving by taking the last value,
# and `hostNetwork: yes` in three DaemonSets, which apply accepted and diff
# rejected with `unrecognized type: bool`.
#
# It does not touch a cluster. No credentials, no kubeconfig.
name: Build Kubernetes manifests

on:
  pull_request:
    paths:
      - 'k8s/**'
      - 'scripts/check-manifests.py'
      - '.github/workflows/kustomize.yaml'
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'scripts/check-manifests.py'
      - '.github/workflows/kustomize.yaml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cluster:
          - do-production
          - large
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build ${{ matrix.cluster }}
        run: kubectl kustomize "k8s/clusters/${{ matrix.cluster }}" > /tmp/built.yaml

      - name: Report what was built
        run: |
          echo "### ${{ matrix.cluster }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '^kind:' /tmp/built.yaml | sort | uniq -c | sort -rn >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check the rendered manifests
        run: python3 scripts/check-manifests.py "${{ matrix.cluster }}" < /tmp/built.yaml

  # kube-system components, reconciled by flux/do-production/infrastructure.yaml
  # rather than by a cluster overlay. A separate job so the existing per-cluster
  # check names stay as they are.
  # The upgrade workflow decides which Mastodon version to move to, and it runs
  # unattended on a schedule. Getting that choice wrong opens a pull request
  # that skips a minor, so the policy is worth a test rather than a read.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version picker
        run: python3 scripts/tests/test_next_mastodon_version.py

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and check k8s/infrastructure
        run: |
          kubectl kustomize k8s/infrastructure > /tmp/built.yaml
          python3 scripts/check-manifests.py k8s/infrastructure < /tmp/built.yaml
          {
            echo "### k8s/infrastructure"
            echo '```'
            grep '^kind:' /tmp/built.yaml | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
