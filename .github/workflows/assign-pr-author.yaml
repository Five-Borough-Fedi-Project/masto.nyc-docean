# Assigns a new pull request to whoever opened it.
#
# This exists because the default pull request view filters to what is assigned
# to you, and nothing in this repository was ever assigned to anybody. Five
# Renovate pull requests sat unnoticed because of it.
#
# It assigns the author rather than a fixed person, since the repository has two
# admins and putting everything on one of them would hijack the other's work.
# Renovate assigns itself through `assignees` in renovate.json, because a bot
# cannot be an assignee and would otherwise be skipped by the check below.
#
# Only acts when nobody is assigned already, so setting an assignee by hand
# survives a reopen.
name: Assign PR to its author

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    # Bots cannot be assignees. Skipping them here is what makes the
    # renovate.json setting necessary rather than redundant.
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.assignees[0] == null
    runs-on: ubuntu-latest
    steps:
      - name: Assign the author
        uses: actions/github-script@v7
        with:
          script: |
            // A pull request from a fork runs with a read-only token, so this
            // step fails there rather than silently doing nothing. Every pull
            // request in this repository comes from a branch in the repository
            // itself, so that case is theoretical for now.
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: [context.payload.pull_request.user.login],
            });
            core.info(`Assigned #${context.payload.pull_request.number} to ${context.payload.pull_request.user.login}`);
