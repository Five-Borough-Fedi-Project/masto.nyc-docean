# Scans every pull request for committed credentials.
#
# This exists because of a specific failure. On 2026-09-04 a restructure staged
# with `git add -A` swept two untracked files into this repository, and both
# carried a BetterStack source token in plaintext. The repository is public.
# .gitignore only matches `private*`, and no pattern would have caught a file
# named values.yaml. Nothing in CI looked at file contents, so it merged.
#
# The scan reads the working tree, not the git history. History still contains
# those tokens and always will, so scanning it would fail every run forever and
# be switched off within a week. Rotation is the fix for what already leaked;
# this is the guard against the next one.
#
# It does not touch a cluster. No credentials, no kubeconfig.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned by version and checksum. This step runs a downloaded binary over the
  # repository, so it is worth knowing exactly which binary.
  GITLEAKS_VERSION: 8.28.0
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sfL "$url" -o gitleaks.tgz
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      - name: Scan for committed credentials
        run: |
          set -euo pipefail
          ./gitleaks dir . \
            --config .gitleaks.toml \
            --report-format json \
            --report-path leaks.json \
            --redact \
            --no-banner \
            --exit-code 2 && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "No credentials found in the working tree." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$rc" -ne 2 ]; then
            echo "::error::gitleaks failed to run (exit $rc)"
            exit "$rc"
          fi
          {
            echo "### Possible credentials in the working tree"
            echo
            echo "Values are redacted here. Read the file, not this summary."
            echo
            python3 - <<'PY'
          import json
          for x in json.load(open("leaks.json")):
              print(f"- `{x['File']}:{x['StartLine']}` matched rule `{x['RuleID']}`")
          PY
            echo
            echo "If this is a false positive, add the shape to \`.gitleaks.toml\`."
            echo "If it is real, rotate the credential first. Removing the file"
            echo "does not unpublish what was already pushed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::gitleaks found $(python3 -c 'import json;print(len(json.load(open("leaks.json"))))') possible credentials"
          exit 1
