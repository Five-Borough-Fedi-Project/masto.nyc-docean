# Purges the Cloudflare cache for masto.nyc.
#
# Run it after an upgrade has actually landed. It cannot be part of the upgrade
# workflow, which only opens the pull request: Flux does the deploy, minutes
# later, and Actions has no way to watch that happen. It also cannot reach
# either cluster. Cloudflare is a public API, which is the one thing here
# Actions can talk to.
#
# Inert until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID exist. Without them it
# reports what it would have done and succeeds, so this can be merged and left
# alone until the credentials are ready.
name: Purge Cloudflare cache

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why (recorded in the run summary)'
        required: false
        default: 'post-upgrade'
        type: string
  # So an upgrade flow can call it later without duplicating any of this.
  workflow_call:
    inputs:
      reason:
        required: false
        default: 'called by another workflow'
        type: string

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge everything
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ] || [ -z "${ZONE:-}" ]; then
            {
              echo "### Skipped"
              echo
              echo "\`CLOUDFLARE_API_TOKEN\` or \`CLOUDFLARE_ZONE_ID\` is not set, so"
              echo "nothing was purged. The token needs **Zone → Cache Purge**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Cloudflare credentials absent. Nothing purged."
            exit 0
          fi

          # Fails the step on a non-2xx rather than reporting success against an
          # error body, which is the usual way a purge silently does nothing.
          body=$(curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/purge_cache" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}') || {
              echo "::error::Purge request failed."
              printf '%s\n' "$body" | head -20
              exit 1
            }

          ok=$(printf '%s' "$body" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("success"))')
          if [ "$ok" != "True" ]; then
            echo "::error::Cloudflare reported failure."
            printf '%s\n' "$body" | head -20
            exit 1
          fi

          {
            echo "### Cache purged"
            echo
            echo "Reason: ${REASON}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Purged. Reason: ${REASON}"
