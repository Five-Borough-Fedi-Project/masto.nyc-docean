# Opens the pull request for a Mastodon version bump.
#
# This automates the mechanical half of an upgrade: checking the tags exist,
# editing both cluster overlays, proving they still build, and putting the
# checklist somewhere you cannot avoid reading it.
#
# It deliberately stops there. The rest of an upgrade needs a drained site and
# a database, and this repository has no cluster credentials in CI on purpose.
# Merging the pull request this opens deploys the new image through Flux, so
# merge it during the window, after the migrations have run.
#
# scale_for_upgrade.sh stays. It is the manual half.
name: Mastodon upgrade PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version, e.g. v4.7.1. Leave empty to pick the next one.'
        required: false
        type: string
  schedule:
    # Daily. The job reads a release list and opens at most one pull request,
    # and it will not open a second for a version that already has one, so a
    # daily run is idempotent rather than noisy. Actions cron is UTC only, so
    # this is 09:00 in New York for half the year and 08:00 for the other half.
    #
    # GitHub disables scheduled workflows in a repository with no activity for
    # 60 days. Renovate commits often enough that this will not happen here.
    - cron: '0 13 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  # Renovate is switched off for the Mastodon images on purpose: a version bump
  # has to rename both migration Jobs and re-point the Flux health checks in the
  # same commit, and Renovate would open a pull request that edits the tag alone.
  # The cost of that was that nothing announced a new release, so an upgrade
  # happened only when somebody noticed.
  #
  # This job is the announcement. It picks a target and hands it to the same job
  # a manual dispatch uses. It deploys nothing: merging is still the gate, and
  # docs/upgrade-runbook.md still governs the window.
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the target version
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED:-}" ]; then
            echo "  dispatched explicitly: $REQUESTED"
            echo "version=$REQUESTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(grep -A1 'name: ghcr.io/mastodon/mastodon$' \
            k8s/clusters/do-production/kustomization.yaml | awk '/newTag:/{print $2}')
          echo "  currently deployed: $current"

          if ! gh api repos/mastodon/mastodon/releases --paginate \
                 --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
                 > /tmp/tags; then
            echo "::warning::Could not list upstream releases. Nothing to do."
            exit 0
          fi
          echo "  upstream releases: $(wc -l < /tmp/tags)"

          target=$(python3 scripts/next-mastodon-version.py "$current" < /tmp/tags)
          if [ -z "$target" ]; then
            echo "  nothing newer than $current"
            exit 0
          fi
          echo "  next target: $target"

          # Running daily, the skip paths matter more than the open path: this
          # job is silent most days and silence has to be legible. Each one says
          # which case it hit, and the step summary carries it so a skip is
          # visible without opening the log.
          branch="upgrade/mastodon-${target}"
          note() { echo "  $1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          state=$(gh pr list --state all --head "$branch" \
            --json number,state,url --jq '.[0] | "\(.state) \(.number) \(.url)"' 2>/dev/null || true)
          case "${state%% *}" in
            OPEN)
              note "A pull request for ${target} is already open: ${state#* * }"
              exit 0 ;;
            MERGED)
              note "${target} was merged already but the overlay still says ${current}. Look at this."
              exit 0 ;;
            CLOSED)
              note "A pull request for ${target} was closed without merging, so it is being skipped on purpose. Delete branch ${branch} to be offered it again."
              exit 0 ;;
          esac

          # A branch with no pull request behind it is leftover, and silently
          # skipping it would hide the next release indefinitely.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            note "Branch ${branch} exists with no pull request. It is stale; delete it and this will run again."
            exit 0
          fi

          echo "version=$target" >> "$GITHUB_OUTPUT"
          echo "Opening a pull request for ${target}, up from ${current}." >> "$GITHUB_STEP_SUMMARY"

  open-pr:
    needs: detect
    if: needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the tag looks like a version and is not what we already run
        id: check
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          current=$(grep -A1 'name: ghcr.io/mastodon/mastodon$' \
            k8s/clusters/do-production/kustomization.yaml | awk '/newTag:/{print $2}')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$VERSION" ]; then
            echo "::error::do-production already runs $VERSION"
            exit 1
          fi
          echo "$current -> $VERSION"

      - name: Both upstream images must exist before we edit anything
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          for repo in mastodon/mastodon mastodon/mastodon-streaming; do
            token=$(curl -sf "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${VERSION}")
            if [ "$code" != "200" ]; then
              echo "::error::ghcr.io/${repo}:${VERSION} returned HTTP ${code}"
              exit 1
            fi
            echo "  ghcr.io/${repo}:${VERSION} exists"
          done

      # Mastodon marks non-routine upgrades in an "Upgrade overview" section
      # with a fixed vocabulary. Across 60 releases only four markers appear:
      #
      #   Requires assets recompilation                 29x, mostly patches
      #   Requires streaming server restart              3x, only .0 minors
      #   Requires database migrations                   2x, only .0 minors
      #   Requires unusually long database migrations    1x, v4.7.0
      #
      # Assets recompilation does not apply here, since these are upstream
      # prebuilt images. The database markers have only ever appeared on .0
      # releases, so the version number is a decent proxy, and the marker is the
      # thing that is actually true.
      - name: Read the release notes for anything unusual
        id: notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          body=$(curl -sfL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/mastodon/mastodon/releases/tags/${VERSION}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("body") or "")') || {
              echo "::warning::Could not fetch release notes for ${VERSION}. Read them yourself."
              echo "risk=unknown" >> "$GITHUB_OUTPUT"; exit 0; }

          overview=$(printf '%s' "$body" | sed -n '/[Uu]pgrade overview/,/^#\{1,\} /p')
          printf '%s' "$overview" | sed 's/^/  /'

          risk=routine
          if printf '%s' "$overview" | grep -qi 'unusually long database migrations'; then
            risk=long
          elif printf '%s' "$overview" | grep -qi 'requires database migrations'; then
            risk=migrations
          fi
          echo "risk=$risk" >> "$GITHUB_OUTPUT"

          case "$risk" in
            long)
              echo "::warning::${VERSION} declares unusually long database migrations. Use the manual path in docs/upgrade-runbook.md." ;;
            migrations)
              echo "::notice::${VERSION} declares database migrations. The Flux ordering handles these, but read the notes." ;;
            *)
              echo "::notice::${VERSION} declares nothing unusual for a container deployment." ;;
          esac

      - name: Bump the overlays and the migration jobs, and prove they build
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib
          v = os.environ["VERSION"]
          # Job names cannot contain dots.
          slug = v.replace(".", "-")

          for f in ("k8s/clusters/do-production/kustomization.yaml",
                    "k8s/clusters/large/kustomization.yaml"):
              p = pathlib.Path(f)
              s = p.read_text()
              s = re.sub(r"(name: ghcr\.io/mastodon/mastodon(?:-streaming)?\n\s+newTag: )\S+",
                         lambda m: m.group(1) + v, s)
              p.write_text(s)
              print("  bumped", f)

          # Job specs are immutable, so an upgrade needs a new name rather than
          # an edit. Flux prunes the previous one.
          for phase in ("pre", "post"):
              p = pathlib.Path("k8s/migrate/%s/job.yaml" % phase)
              s = p.read_text()
              s = re.sub(r"(name: mastodon-migrate-%s-)v[\d-]+" % phase,
                         lambda m: m.group(1) + slug, s)
              s = re.sub(r'(image: "ghcr\.io/mastodon/mastodon:)v[\d.]+"',
                         lambda m: m.group(1) + v + '"', s)
              p.write_text(s)
              print("  bumped", p)

              # The health check has to name the Job that now exists, or Flux
              # waits forever on one that was pruned.
              p = pathlib.Path("flux/do-production/migrate-%s.yaml" % phase)
              s = p.read_text()
              s = re.sub(r"(name: mastodon-migrate-%s-)v[\d-]+" % phase,
                         lambda m: m.group(1) + slug, s)
              p.write_text(s)
              print("  bumped", p)
          PY
          git diff --stat
          for cluster in do-production large; do
            kubectl kustomize "k8s/clusters/$cluster" > "/tmp/$cluster.yaml"
          done
          kubectl kustomize k8s/migrate/pre  > /tmp/pre.yaml
          kubectl kustomize k8s/migrate/post > /tmp/post.yaml
          grep -h 'image: ghcr.io/mastodon' /tmp/do-production.yaml /tmp/large.yaml /tmp/pre.yaml /tmp/post.yaml | sort -u
          grep -h 'name: mastodon-migrate' /tmp/pre.yaml /tmp/post.yaml

          # A health check naming a Job that does not exist makes Flux wait
          # until it times out, so the two have to agree.
          for phase in pre post; do
            job=$(awk '/^  name: mastodon-migrate-/{print $2}' "/tmp/$phase.yaml" | head -1)
            want=$(awk '/name: mastodon-migrate-/{print $NF}' "flux/do-production/migrate-$phase.yaml" | head -1)
            if [ "$job" != "$want" ]; then
              echo "::error::migrate-$phase health check names '$want' but the Job is '$job'"
              exit 1
            fi
            echo "  $phase: health check and Job agree on $job"
          done

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          CURRENT: ${{ steps.check.outputs.current }}
          ACTOR: ${{ github.actor }}
          RISK: ${{ steps.notes.outputs.risk }}
        run: |
          set -euo pipefail
          branch="upgrade/mastodon-${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -aqm "mastodon: ${CURRENT} to ${VERSION}"
          git push -qu origin "$branch"

          cat > /tmp/body <<EOF
          Bumps both cluster overlays from \`${CURRENT}\` to \`${VERSION}\`. Both
          upstream images were confirmed present in GHCR and both overlays build.

          **Do not merge outside an upgrade window.** Flux reconciles \`main\`
          within ten minutes, so merging deploys the new image. The migrations
          have to run first, against a drained site.

          Release notes classify this as: **${RISK}**

          Read \`docs/upgrade-runbook.md\`. The short version:

          - [ ] Read the release notes for every version between ${CURRENT} and ${VERSION}
          - [ ] Check the migration backlog is clear (\`mastodon-migration-status\` cronjob)
          - [ ] Check database disk headroom
          - [ ] Let the nightly backup finish, or run one
          - [ ] Close every SQL client, including DBeaver
          - [ ] \`./scale_for_upgrade.sh drain do\` and \`drain lab\` (suspends Flux)
          - [ ] Run the migrations
          - [ ] **Merge this**
          - [ ] \`./scale_for_upgrade.sh fill do\` and \`fill lab\` (resumes Flux)
          - [ ] Re-run the migration status check
          EOF

          if gh pr create --base main --head "$branch" \
               --title "mastodon: ${CURRENT} to ${VERSION}" \
               --assignee "$ACTOR" --body-file /tmp/body; then
            echo "Pull request opened." >> "$GITHUB_STEP_SUMMARY"
          else
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            echo "::warning::Could not open the pull request. The branch is pushed."
            {
              echo "### Branch pushed, pull request not opened"
              echo
              echo "The organisation forbids GitHub Actions from creating pull requests."
              echo
              echo "[Open it here](${url})"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
