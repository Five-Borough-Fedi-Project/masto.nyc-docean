# Preview card (link thumbnail) cleanup
# tootctl's own default here is 180 days; we use 90 to match the rest of the
# cleanup rotation.
#
# Weekly cleanup rotation (all at 05:00, one per day, no two ever concurrent):
#   Sun  media remove --days=90        (cronjob-media-remove.yaml)
#   Mon  media remove --prune-profiles
#   Tue  preview_cards remove          (this file)
#   Wed  statuses remove
#   Thu  -- buffer for a long statuses run --
#   Fri  media remove-orphans          (sweeps files the above orphaned)
#   Sat  -- buffer --
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mastodon-preview-cards-remove
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/instance: mastodon
    app.kubernetes.io/version: "v4.7.0"
spec:
  schedule: 0 5 * * 2
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # 23h ceiling guarantees this cannot bleed into the next day's job
      activeDeadlineSeconds: 82800
      backoffLimit: 1
      template:
        metadata:
          name: mastodon-preview-cards-remove
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mastodon-preview-cards-remove
              image: "ghcr.io/mastodon/mastodon:v4.7.0"
              imagePullPolicy: IfNotPresent
              command:
                - bin/tootctl
                - preview_cards
                - remove
                - --days=180
                - --verbose
              envFrom:
              - secretRef:
                  name: mastodon-env-secret
              - secretRef:
                  name: mastodon-env-tf
