# Media cleanup
# We cleanup weekly, just like the default helm chart has set. There hasn't been
# much of a need to extend or shorten that so far.
#
# Weekly cleanup rotation (all at 05:00, one per day, no two ever concurrent):
#   Sun  media remove --days=90        (this file)
#   Mon  media remove --prune-profiles
#   Tue  preview_cards remove
#   Wed  statuses remove
#   Thu  -- buffer for a long statuses run --
#   Fri  media remove-orphans          (sweeps files the above orphaned)
#   Sat  -- buffer --
---
# Source: mastodon/templates/cronjob-media-remove.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mastodon-media-remove
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/instance: mastodon
    app.kubernetes.io/version: "v4.7.0"
spec:
  schedule: 0 5 * * 0
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # 23h ceiling guarantees this cannot bleed into the next day's job
      activeDeadlineSeconds: 82800
      backoffLimit: 1
      template:
        metadata:
          name: mastodon-media-remove
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mastodon-media-remove
              image: "ghcr.io/mastodon/mastodon:v4.7.0"
              imagePullPolicy: IfNotPresent
              command:
                - bin/tootctl
                - media
                - remove
                - --days=180
                - --verbose
              envFrom:
              - configMapRef:
                  name: mastodon-env-secret
              - configMapRef:
                  name: mastodon-env-tf
