# Orphaned storage file sweep
# Scans object storage for files with no corresponding media attachment row.
# Deliberately runs last in the week: the DB-level removals earlier in the
# rotation (especially `statuses remove`) are what strand files in the first
# place, so sweeping afterwards catches their leftovers in the same cycle.
# `media remove-orphans` takes no --verbose flag.
#
# Weekly cleanup rotation (all at 05:00, one per day, no two ever concurrent):
#   Sun  media remove --days=90        (cronjob-media-remove.yaml)
#   Mon  media remove --prune-profiles
#   Tue  preview_cards remove
#   Wed  statuses remove
#   Thu  -- buffer for a long statuses run --
#   Fri  media remove-orphans          (this file)
#   Sat  -- buffer --
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mastodon-media-remove-orphans
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/instance: mastodon
    app.kubernetes.io/version: "v4.6.4"
spec:
  schedule: 0 5 * * 5
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # 23h ceiling guarantees this cannot bleed into Saturday
      activeDeadlineSeconds: 82800
      backoffLimit: 1
      template:
        metadata:
          name: mastodon-media-remove-orphans
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mastodon-media-remove-orphans
              image: "ghcr.io/mastodon/mastodon:v4.6.4"
              imagePullPolicy: IfNotPresent
              command:
                - bin/tootctl
                - media
                - remove-orphans
              envFrom:
              - configMapRef:
                  name: mastodon-env-secret
              - configMapRef:
                  name: mastodon-env-tf
