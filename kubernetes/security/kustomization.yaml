# The netshoot debug pod.
#
# web-ext.yaml held a CiliumNetworkPolicy restricting cloudflared egress to an
# FQDN allowlist. It was removed on 2026-09-04: it had been sitting in the repo
# unapplied, so the restriction it describes was never in force, and Cilium was
# not working out when it was first tried. Revisiting Cilium is the last item in
# docs/devops-roadmap.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mastodon
resources:
  - dbg.yaml
