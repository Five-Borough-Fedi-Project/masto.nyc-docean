# Post-deployment migrations, run once the deployments are on the new image.
#
# healthChecks makes Flux wait for the Job to complete rather than only for it
# to be created. kstatus maps batch/Job to jobConditions, so a Job that is still
# running holds this Kustomization not-ready, and `apps` waits behind it.
#
# Depends on `apps`, so it runs only after the new image is rolled out. A
# failure here leaves the site running and serving on the new code, with the
# post-deployment work outstanding, which is recoverable by rerunning.
#
# Job names carry the version and Job specs are immutable, so an upgrade means a
# new name. prune removes the previous one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: migrate-post
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  # Long enough for a real migration. The v4.7.0 run took most of an hour.
  timeout: 90m
  path: ./k8s/migrate/post
  prune: true
  wait: true
  dependsOn:
    - name: apps
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: mastodon-migrate-post-v4-7-1
      namespace: mastodon
  sourceRef:
    kind: GitRepository
    name: flux-system
