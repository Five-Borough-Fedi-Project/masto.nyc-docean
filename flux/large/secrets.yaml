# Encrypted secrets, reconciled first so workloads never start before the
# Secrets they read exist.
#
# decryption points at a Secret named sops-age in flux-system, holding the age
# private key for this cluster. That Secret is created out of band, once, and is
# deliberately the only thing in this system not in git.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  path: ./k8s/secrets/large
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
